[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Filter out external library deprecation noise
filterwarnings =
    ignore:Camellia has been moved:cryptography.utils.CryptographyDeprecationWarning
    ignore:CFB has been moved:cryptography.utils.CryptographyDeprecationWarning
    ignore:.*tpm2_pytss.*:getpass.GetPassWarning